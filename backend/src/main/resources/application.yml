spring:
  application:
    name: aprende-aprender-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aprende_aprender}
    username: ${DB_USER:aprende}
    password: ${DB_PASSWORD:aprende_local}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    session-hours: ${SESSION_HOURS:24}
